<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warrior Workouts">
<title>Warrior Workouts</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="wordmark">WARRIOR WORKOUTS</div>
    <button class="icon-btn" id="menuBtn" aria-label="Data and settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
    </button>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="library" class="active">Workouts</button>
    <button data-tab="history">History</button>
    <button data-tab="progress">Progress</button>
  </nav>
</div>

<div class="timer" id="timer" hidden>
  <div class="timer-ring"><span id="timerText">1:30</span></div>
  <div class="timer-actions">
    <button id="timerMinus">−15s</button>
    <button id="timerPlus">+15s</button>
    <button id="timerSkip" class="ghost">Skip</button>
  </div>
</div>

<dialog id="sheet"><div id="sheetBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script src="storage.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
